  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{background:#0f1923;min-height:100vh;font-family:'Source Serif 4',serif;}
    input,textarea,select{background:rgba(255,255,255,0.05)!important;border:none!important;border-bottom:1.5px solid rgba(255,165,0,0.35)!important;color:#e8dcc8!important;font-family:'Source Serif 4',serif!important;font-size:15px!important;padding:8px 4px!important;border-radius:0!important;outline:none!important;width:100%;transition:border-color 0.2s;}
    input:focus,textarea:focus,select:focus{border-bottom-color:#f5a623!important;background:rgba(245,166,35,0.06)!important;}
    textarea{resize:vertical;min-height:80px;}
    select option{background:#1a2a3a;color:#e8dcc8;}
    ::-webkit-scrollbar{width:4px;}
    ::-webkit-scrollbar-thumb{background:rgba(245,166,35,0.3);border-radius:2px;}
    /* APR Styles */
    .apr-tabs{display:flex;gap:2px;margin-bottom:16px;background:#0a0a0a;border-radius:10px;padding:3px;border:1px solid rgba(245,166,35,0.15);}
    .apr-tab{flex:1;padding:10px;border:none;background:transparent;color:rgba(255,255,255,0.4);font-family:'Oswald',sans-serif;font-size:12px;letter-spacing:1px;border-radius:8px;cursor:pointer;transition:all 0.2s;}
    .apr-tab.active{background:#c0392b;color:#000;font-weight:700;}
    .apr-card{background:#111;border:1px solid rgba(245,166,35,0.12);border-radius:10px;padding:14px;margin-bottom:10px;}
    .apr-card-header{font-family:'Oswald',sans-serif;font-weight:600;font-size:13px;color:#f5c518;letter-spacing:1px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;}
    .apr-badge{background:rgba(192,57,43,0.2);color:#f5c518;font-family:'Oswald',sans-serif;font-size:10px;padding:2px 8px;border-radius:10px;letter-spacing:1px;border:1px solid rgba(245,166,35,0.2);}
    .apr-chip{display:inline-block;background:rgba(192,57,43,0.15);color:#e8dcc8;font-size:11px;padding:3px 8px;border-radius:6px;margin:2px;border:1px solid rgba(245,166,35,0.1);}
    .apr-btn{background:linear-gradient(135deg,#c0392b,#96281b);border:none;border-radius:8px;padding:10px 16px;color:#fff;font-family:'Oswald',sans-serif;font-size:12px;letter-spacing:1px;cursor:pointer;display:flex;align-items:center;gap:6px;}
    .apr-btn-sm{background:rgba(192,57,43,0.2);border:1px solid rgba(245,166,35,0.2);color:#f5c518;border-radius:6px;padding:5px 10px;font-family:'Oswald',sans-serif;font-size:10px;letter-spacing:1px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;}
    .apr-btn-outline{background:transparent;border:1px solid rgba(245,166,35,0.3);color:#f5c518;border-radius:8px;padding:8px 14px;font-family:'Oswald',sans-serif;font-size:11px;letter-spacing:1px;cursor:pointer;}
    .apr-checkbox{width:20px;height:20px;border:2px solid rgba(245,166,35,0.3);border-radius:4px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
    .apr-checkbox.checked{background:#c0392b;border-color:#f5c518;}
    .apr-checkbox.checked::after{content:'✓';color:#000;font-weight:700;font-size:13px;}
    .apr-empty{text-align:center;padding:40px 20px;color:rgba(255,255,255,0.3);font-family:'Oswald',sans-serif;font-size:13px;letter-spacing:2px;}
    .apr-risco-item{background:rgba(0,0,0,0.3);border-left:2px solid rgba(245,166,35,0.3);padding:8px 12px;margin-bottom:6px;border-radius:0 6px 6px 0;font-size:12px;color:rgba(232,220,200,0.8);}
    .apr-risco-item strong{color:#f5c518;font-size:11px;font-family:'Oswald',sans-serif;letter-spacing:1px;}
    .apr-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
    @media(max-width:480px){.apr-grid{grid-template-columns:1fr;}}
    /* Futuristic Folder Tiles */
    @keyframes folderPulse{0%,100%{opacity:0.35;}50%{opacity:0.75;}}
    @keyframes folderSpin{to{transform:rotate(360deg);}}
    @keyframes folderFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-5px);}}
    @keyframes folderScan{0%{transform:translateY(-100%);}100%{transform:translateY(100%);}}
    .folder-tile-fx{position:relative;isolation:isolate;background:linear-gradient(160deg,#0d0d0d,#050505);transition:transform 0.25s ease,box-shadow 0.25s ease;overflow:hidden;}
    .folder-tile-fx::before{content:'';position:absolute;inset:-1px;border-radius:inherit;padding:1.5px;background:conic-gradient(from 0deg,var(--glow,#f5c518),transparent 25%,transparent 50%,var(--glow,#f5c518) 75%,transparent 100%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:0;transition:opacity 0.35s ease;z-index:0;}
    .folder-tile-fx::after{content:'';position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 14px var(--glow,#f5c518),0 0 16px -6px var(--glow,#f5c518);opacity:0.22;transition:opacity 0.35s ease;pointer-events:none;z-index:0;}
    .folder-tile-fx:hover,.folder-tile-fx:focus-visible,.folder-tile-fx:active{transform:translateY(-6px) scale(1.03);box-shadow:0 16px 40px -8px var(--glow,#f5c518);}
    .folder-tile-fx:hover::before,.folder-tile-fx:focus-visible::before,.folder-tile-fx:active::before{opacity:1;animation:folderSpin 2.2s linear infinite;}
    .folder-tile-fx:hover::after,.folder-tile-fx:focus-visible::after,.folder-tile-fx:active::after{opacity:0.8;animation:folderPulse 1.6s ease-in-out infinite;}
    .folder-tile-fx .folder-tile-fx-icon{position:relative;z-index:1;}
    .folder-tile-fx:hover .folder-tile-fx-icon,.folder-tile-fx:focus-visible .folder-tile-fx-icon,.folder-tile-fx:active .folder-tile-fx-icon{animation:folderFloat 1.6s ease-in-out infinite;}
    .folder-tile-fx .folder-tile-fx-icon::after{content:'';position:absolute;inset:-14px;border-radius:50%;background:radial-gradient(circle,var(--glow,#f5c518),transparent 70%);opacity:0;filter:blur(2px);transition:opacity 0.35s ease;z-index:-1;}
    .folder-tile-fx:hover .folder-tile-fx-icon::after,.folder-tile-fx:focus-visible .folder-tile-fx-icon::after,.folder-tile-fx:active .folder-tile-fx-icon::after{opacity:0.55;}
    .folder-tile-fx .folder-tile-fx-scan{position:absolute;left:0;right:0;height:40%;background:linear-gradient(180deg,transparent,var(--glow,#f5c518)18,transparent);opacity:0;pointer-events:none;z-index:0;}
    .folder-tile-fx:hover .folder-tile-fx-scan,.folder-tile-fx:focus-visible .folder-tile-fx-scan,.folder-tile-fx:active .folder-tile-fx-scan{opacity:0.5;animation:folderScan 1.8s linear infinite;}
    .folder-tile-fx .folder-tile-fx-body{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:14px;}
    /* Loading spinner */
    .loading-screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0f1923;z-index:9999;}
    .loading-spinner{width:44px;height:44px;border:3px solid rgba(245,166,35,0.15);border-top-color:#f5a623;border-radius:50%;animation:lspin .8s linear infinite;}
    @keyframes lspin{to{transform:rotate(360deg)}}
    .loading-text{font-family:Oswald,sans-serif;font-size:13px;letter-spacing:2px;color:rgba(232,220,200,0.5);margin-top:16px;}
  </style>

<script>
const LOGO_SRC = window.__LOGO_SRC__;
const {
  useState,
  useRef,
  useEffect,
  useCallback,
  useMemo
} = React;
const CATEGORIAS = ["Ferramentas", "Comportamental", "Documentos", "EPI", "Equipamentos", "5S", "Sinalização", "Reconhecimento"];
const ROLES_LIMITADAS = ['tecnico', 'engcivil', 'engplan', 'encarregado', 'adm'];
const ROLE_LABELS = {
  gestor: 'ADMINISTRADOR',
  gestorobra: 'GERENTE DE CONTRATO',
  tecnico: 'TST',
  engcivil: 'ENGENHEIRO CIVIL',
  engplan: 'ENG. PLANEJAMENTO',
  encarregado: 'ENCARREGADO',
  adm: 'ADM'
};
const SESSION_KEY = 'rdr_session';
const session = {
  get: () => {
    try {
      return JSON.parse(sessionStorage.getItem(SESSION_KEY) || 'null');
    } catch {
      return null;
    }
  },
  set: u => sessionStorage.setItem(SESSION_KEY, JSON.stringify(u)),
  clear: () => sessionStorage.removeItem(SESSION_KEY)
};

// ── Normalização de dados (snake_case do banco -> camelCase do app) ──
const mapRecord = r => ({
  ...r,
  dataOcorrido: r.data_ocorrido,
  autorId: r.autor_id,
  autorNome: r.autor_nome,
  nomeColaborador: r.nome_colaborador,
  responsavelSetor: r.responsavel_setor,
  responsavelRegistro: r.responsavel_registro,
  sugestaoCorrecao: r.sugestao_correcao,
  savedAt: r.saved_at
});
const mapAtividade = a => ({ ...a, recomendacoesGerais: a.recomendacoes_gerais });
const mapMontagem = m => ({
  ...m,
  responsavelSesmt: m.responsavel_sesmt,
  dataInicio: m.data_inicio,
  dataTermino: m.data_termino,
  recomendacoesGerais: m.recomendacoes_gerais,
  autorId: m.autor_id,
  autorNome: m.autor_nome,
  criadaEm: m.criada_em
});
const mapLog = l => ({ ...l, ...(l.dados || {}), atividadeId: l.atividade_id != null && l.atividade_id !== '' ? Number(l.atividade_id) : null, criadaEm: l.criada_em });

// ── Supabase helpers ──
const fsdb = {
  // Users
  async updateUser(id, updates) {
    const { error } = await sb.from('rdr_users').update(updates).eq('id', id);
    if (error) throw error;
  },
  async addUser(u) {
    const { data, error } = await sb.from('rdr_users').insert({
      nome: u.nome,
      usuario: u.usuario.toLowerCase(),
      senha: u.senha,
      role: u.role,
      ativo: true
    }).select().single();
    if (error) throw error;
    return { id: data.id, ...u };
  },
  async deleteUser(id) {
    await sb.from('rdr_users').delete().eq('id', id);
  },
  async findUser(usuario, senha) {
    const { data, error } = await sb.from('rdr_users').select('*').eq('usuario', usuario.toLowerCase()).eq('senha', senha).maybeSingle();
    if (error || !data || data.ativo === false) return null;
    return data;
  },
  async userExists(usuario) {
    const { data } = await sb.from('rdr_users').select('id').eq('usuario', usuario.toLowerCase()).maybeSingle();
    return !!data;
  },
  // Listeners tempo real
  subscribeUsers(callback) {
    let query = sb.from('rdr_users').select('*');
    query.then(({ data }) => {
      if (data) callback(data);
    });
    const channel = sb
      .channel('rdr_users_changes')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'rdr_users' }, async () => {
        const { data } = await sb.from('rdr_users').select('*');
        if (data) callback(data);
      })
      .subscribe();
    return () => { sb.removeChannel(channel); };
  },
  subscribeRecords(callback, autorId = null) {
    let query = sb.from('rdr_records').select('*');
    if (autorId) query = query.eq('autor_id', autorId);
    query.order('saved_at', { ascending: false }).then(({ data }) => {
      if (data) callback((data || []).map(mapRecord));
    });
    const channel = sb
      .channel('rdr_records_changes')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'rdr_records' }, async () => {
        let q = sb.from('rdr_records').select('*');
        if (autorId) q = q.eq('autor_id', autorId);
        const { data } = await q.order('saved_at', { ascending: false });
        if (data) callback((data || []).map(mapRecord));
      })
      .subscribe();
    return () => { sb.removeChannel(channel); };
  },
  // Records
  async saveRecord(rec) {
    if (rec.id && rec._exists) {
      const { _exists, ...payload } = rec;
      const { error } = await sb.from('rdr_records').update({
        data_ocorrido: rec.dataOcorrido,
        hora: rec.hora,
        autor_id: rec.autorId,
        autor_nome: rec.autorNome,
        local: rec.local,
        categorias: rec.categorias,
        concluido: rec.concluido,
        nome_colaborador: rec.nomeColaborador,
        responsavel_setor: rec.responsavelSetor,
        responsavel_registro: rec.responsavelRegistro,
        descricao: rec.descricao,

// ── PDF DASHBOARD COM GRÁFICOS VISUAIS ──
function getJsPDF() {
  // jsPDF UMD expõe em window.jspdf.jsPDF
  if (window.jspdf && window.jspdf.jsPDF) return window.jspdf.jsPDF;
  // Fallback: alguns builds expõem diretamente em window.jsPDF
  if (window.jsPDF) return window.jsPDF;
  return null;
}
function carregarJsPDF() {
  return new Promise((resolve, reject) => {
    if (getJsPDF()) {
      resolve();
      return;
    }
    const fontes = ["https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js", "https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"];
    let i = 0;
    function tentar() {
      if (i >= fontes.length) {
        reject(new Error("Falha ao carregar biblioteca de PDF"));
        return;
      }
      const s = document.createElement("script");
      s.src = fontes[i];
      s.onload = () => {
        setTimeout(() => {
          if (getJsPDF()) resolve();else {
            i++;
            tentar();
          }
        }, 100);
      };
      s.onerror = () => {
        i++;
        tentar();
      };
      document.head.appendChild(s);
    }
    tentar();
  });
}
async function gerarPDFDashboard(registros) {
  try {
    await carregarJsPDF();
    const jsPDF = getJsPDF();
    if (!jsPDF) {
      alert("Não foi possível carregar o gerador de PDF. Verifique sua conexão e tente novamente.");
      return;
    }
    const doc = new jsPDF({
      orientation: "portrait",
      unit: "mm",
      format: "a4"
    });
    const W = 210,
      margin = 16,
      col = W - margin * 2;
    let y = 18;
    const CORES = [[245, 166, 35], [39, 174, 96], [52, 152, 219], [231, 76, 60], [155, 89, 182], [26, 188, 156], [230, 126, 34], [46, 204, 113]];
    const ln = (x1, y1, x2, y2, c = [200, 200, 200]) => {
      doc.setDrawColor(...c);
      doc.line(x1, y1, x2, y2);
    };
    const rc = (x, yy, w, h, f = [245, 245, 245]) => {
      doc.setFillColor(...f);
      doc.rect(x, yy, w, h, "F");
    };
    const tx = (t, x, yy, s = 10, b = false, c = [30, 30, 30], align = "left") => {
      doc.setFontSize(s);
      doc.setFont("Arial", b ? "bold" : "normal");
      doc.setTextColor(...c);
      doc.text(String(t ?? ""), x, yy, {
        align
      });
    };

    // ── Cálculos ──
    const hojeKey = new Date().toLocaleDateString('en-CA');
    const mesAtual = hojeKey.slice(0, 7);
    const total = registros.length;
    const concluidos = registros.filter(r => r.concluido === "SIM").length;
    const pendentes = registros.filter(r => r.concluido === "NÃO").length;
    const doMes = registros.filter(r => r.dataOcorrido?.slice(0, 7) === mesAtual).length;
    const txConclusao = total > 0 ? Math.round(concluidos / total * 100) : 0;
    const catCount = {};
    registros.forEach(r => (r.categorias || []).forEach(c => {
      catCount[c] = (catCount[c] || 0) + 1;
    }));
    const catOrd = Object.entries(catCount).sort((a, b) => b[1] - a[1]);
    const tecCount = {};
    registros.forEach(r => {
      if (r.autorNome) tecCount[r.autorNome] = (tecCount[r.autorNome] || 0) + 1;
    });
    const tecOrd = Object.entries(tecCount).sort((a, b) => b[1] - a[1]);
    const mesCount = {};
    registros.forEach(r => {
      if (!r.dataOcorrido) return;
      const k = r.dataOcorrido.slice(0, 7);
      mesCount[k] = (mesCount[k] || 0) + 1;
    });
    const mesOrd = Object.entries(mesCount).sort((a, b) => a[0].localeCompare(b[0])).slice(-6);

    // ── CABEÇALHO ──
    rc(0, 0, W, 32, [20, 40, 60]);
    tx("BDR", margin, 16, 22, true, [245, 166, 35]);

    tx("Segurança do Trabalho", margin, 29, 8, false, [200, 200, 200]);
    tx(new Date().toLocaleDateString("pt-BR"), W - margin, 16, 10, true, [255, 255, 255], "right");
    tx(`${total} registros`, W - margin, 22, 9, false, [200, 200, 200], "right");
    y = 42;

    // ── CARDS DE INDICADORES ──
    const cardW = (col - 12) / 4,
      cardH = 24;
    const cards = [["Total", total, [245, 166, 35]], ["Este Mês", doMes, [52, 152, 219]], ["Concluídos", concluidos, [39, 174, 96]], ["Pendentes", pendentes, [231, 76, 60]]];
    cards.forEach((c, i) => {
      const cx = margin + i * (cardW + 4);
      doc.setFillColor(248, 248, 248);
      doc.roundedRect(cx, y, cardW, cardH, 2, 2, "F");
      doc.setDrawColor(...c[2]);
      doc.setLineWidth(0.6);
      doc.roundedRect(cx, y, cardW, cardH, 2, 2, "S");
      tx(c[1], cx + cardW / 2, y + 13, 18, true, c[2], "center");
      tx(c[0].toUpperCase(), cx + cardW / 2, y + 20, 7, false, [100, 100, 100], "center");
    });
    y += cardH + 10;

    // ── ANEL DE TAXA DE CONCLUSÃO ──
    rc(margin, y, col, 8, [240, 244, 248]);
    tx("TAXA DE CONCLUSÃO", margin + 2, y + 5.5, 8, true, [100, 120, 140]);
    y += 14;
    const cxAnel = margin + 18,
      cyAnel = y + 14,
      raio = 14;
    doc.setDrawColor(230, 230, 230);
    doc.setLineWidth(4);
    doc.circle(cxAnel, cyAnel, raio, "S");
    // Arco proporcional (aproximado com segmentos)
    doc.setDrawColor(245, 166, 35);
    doc.setLineWidth(4);
    const passos = Math.round(txConclusao / 100 * 72);
    for (let i = 0; i < passos; i++) {
      const ang1 = (-90 + i * 5) * Math.PI / 180;
      const ang2 = (-90 + (i + 1) * 5) * Math.PI / 180;
      doc.line(cxAnel + raio * Math.cos(ang1), cyAnel + raio * Math.sin(ang1), cxAnel + raio * Math.cos(ang2), cyAnel + raio * Math.sin(ang2));
    }
    tx(`${txConclusao}%`, cxAnel, cyAnel + 2, 12, true, [245, 166, 35], "center");
    tx(`${concluidos} de ${total} registros concluídos`, margin + 42, y + 10, 10, false, [60, 60, 60]);
    tx(`${pendentes} pendente${pendentes !== 1 ? "s" : ""} de ação`, margin + 42, y + 17, 9, false, [231, 76, 60]);
    y += 34;

    // ── GRÁFICO DE BARRAS: CATEGORIAS ──
    if (catOrd.length > 0) {
      rc(margin, y, col, 8, [240, 244, 248]);

      const maxCat = catOrd[0][1];

      y = 20;
    }

    // ── GRÁFICO DE PIZZA: TÉCNICOS ──
    if (tecOrd.length > 0) {
      rc(margin, y, col, 8, [240, 244, 248]);
      tx("REGISTROS POR TÉCNICO", margin + 2, y + 5.5, 8, true, [100, 120, 140]);
      y += 14;
      const cxPizza = margin + 24,
        cyPizza = y + 20,
        raioPizza = 20;
      let anguloInicio = -90;
      tecOrd.forEach(([nome, qtd], i) => {
        const fatiaGraus = qtd / total * 360;
        const anguloFim = anguloInicio + fatiaGraus;
        const cor = CORES[i % CORES.length];
        doc.setFillColor(...cor);
        const segmentos = Math.max(1, Math.ceil(fatiaGraus / 4));
        for (let s = 0; s < segmentos; s++) {
          const ai = anguloInicio + fatiaGraus * s / segmentos;
          const af = anguloInicio + fatiaGraus * (s + 1) / segmentos;
          const rad1 = ai * Math.PI / 180,
            rad2 = af * Math.PI / 180;
          doc.triangle(cxPizza, cyPizza, cxPizza + raioPizza * Math.cos(rad1), cyPizza + raioPizza * Math.sin(rad1), cxPizza + raioPizza * Math.cos(rad2), cyPizza + raioPizza * Math.sin(rad2), "F");
        }
        anguloInicio = anguloFim;
      });
      // Legenda
      const legX = margin + 56;
      tecOrd.forEach(([nome, qtd], i) => {
        const ly = y + 4 + i * 7;
        const cor = CORES[i % CORES.length];
        doc.setFillColor(...cor);
        doc.rect(legX, ly - 3, 4, 4, "F");
        tx(`${nome}`, legX + 7, ly, 8, false, [60, 60, 60]);
        tx(`${qtd} (${Math.round(qtd / total * 100)}%)`, legX + 7 + 45, ly, 8, true, cor);
      });
      y += Math.max(44, tecOrd.length * 7 + 10);
    }
    if (y > 235) {
      doc.addPage();
      y = 20;
    }

    // ── GRÁFICO DE LINHA: EVOLUÇÃO MENSAL ──
    if (mesOrd.length > 0) {
      rc(margin, y, col, 8, [240, 244, 248]);
      tx("EVOLUÇÃO MENSAL", margin + 2, y + 5.5, 8, true, [100, 120, 140]);
      y += 12;
      const chartH = 36,
        chartW2 = col - 10;
      const maxMes = Math.max(...mesOrd.map(([, q]) => q), 1);
      const stepX = chartW2 / (mesOrd.length - 1 || 1);
      const baseY = y + chartH;
      // eixo
      doc.setDrawColor(220, 220, 220);
      doc.line(margin + 5, baseY, margin + 5 + chartW2, baseY);
      const pontos = mesOrd.map(([mes, qtd], i) => {
        const px = margin + 5 + i * stepX;
        const py = baseY - qtd / maxMes * chartH;
        return [px, py, qtd, mes];
      });
      doc.setDrawColor(245, 166, 35);
      doc.setLineWidth(0.8);
      for (let i = 0; i < pontos.length - 1; i++) {
        doc.line(pontos[i][0], pontos[i][1], pontos[i + 1][0], pontos[i + 1][1]);
      }
      pontos.forEach(([px, py, qtd, mes]) => {
        doc.setFillColor(245, 166, 35);
        doc.circle(px, py, 1.6, "F");
        tx(qtd, px, py - 3, 7, true, [245, 166, 35], "center");
        const [yr, m] = mes.split("-");
        tx(`${m}/${yr.slice(2)}`, px, baseY + 6, 7, false, [100, 100, 100], "center");
      });
      y = baseY + 14;
    }

    // ── RODAPÉ ──
    doc.setDrawColor(220, 220, 220);
    doc.line(margin, 287, W - margin, 287);
    tx(`Gerado em ${new Date().toLocaleString("pt-BR")}`, margin, 292, 7, false, [150, 150, 150]);
    tx("BDR — Segurança do Trabalho", W - margin, 292, 7, false, [150, 150, 150], "right");
    doc.save(`Dashboard_RDR_${hojeKey}.pdf`);
  } catch (err) {
    console.error("Erro ao gerar PDF Dashboard:", err);
    alert("Erro ao gerar PDF: " + (err?.message || err));
  }
}

async function gerarDocxAPR(montagem) {

            bold: true,
            size: 28

          }), txt((montagem.nome || '').toUpperCase(), {

        }), {

          borders: semBorda,

          alignment: AlignmentType.RIGHT,
          children: [new ImageRun({

        children: [txt('Data: ')]
      })];

    const footerTable = new Table({
